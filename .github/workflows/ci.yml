name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure vendor/opencode upstream remote
        run: |
          if [ ! -d "vendor/opencode/.git" ] && [ ! -f "vendor/opencode/.git" ]; then
            git clone https://github.com/anomalyco/opencode.git vendor/opencode
          fi
          git -C vendor/opencode remote add upstream https://github.com/anomalyco/opencode.git 2>/dev/null || true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Python bytecode compilation and CLI smoke checks
        run: |
          python -m compileall -q bel_code tests run_bel_code.py
          python run_bel_code.py --version
          python run_bel_code.py --scan > /dev/null

      - name: Verify repository release checks
        run: python scripts/verify_release.py

      - name: Run automated test suite
        run: pytest -v
