[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bel-code"
version = "2.1.0"
description = "BEL Code — Standalone Autonomous AI Software Engineering Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BEL Code Contributors"}
]
keywords = ["ai", "coding-agent", "autonomous-software-engineering", "opencode", "freellm", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "playwright>=1.40.0",
    "keyring>=24.0.0",
]

[project.scripts]
bel-code = "bel_code.__main__:main"

[project.urls]
Homepage = "https://github.com/Avyansh-AI/BEL-CODE"
Repository = "https://github.com/Avyansh-AI/BEL-CODE"
Issues = "https://github.com/Avyansh-AI/BEL-CODE/issues"

[tool.setuptools.packages.find]
include = ["bel_code*"]

[tool.setuptools.package-data]
bel_code = ["frontend/*", "providers/*.json", "opencode_bridge/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
